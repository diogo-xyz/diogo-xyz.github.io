- id: inesctec-hosky
  type: experience
  tag: Research fellowship
  organization: INESC TEC
  title: Research Initiation Fellow (BII)
  location: Porto, Portugal
  start: "2025-09"
  end: "2026-01"
  summary: Research fellowship in the HOSKY project, applying AI and cybersecurity to public administration.
  details: |
    Research Initiation Fellowship in the **HOSKY** project, developing
    cybersecurity, data science and AI solutions for public administration.

    - Implemented real-time anomaly detection models for continuous data streams.
    - Modelled and executed adversarial attacks against AI systems to expose
      vulnerabilities and design proactive defences.
    - Integrated human-in-the-loop workflows into the AI decision cycle, keeping
      the system transparent, robust and adaptable.
  links:
    - name: INESC TEC
      url: https://www.inesctec.pt

- id: updigital-internship
  type: experience
  tag: Curricular internship
  organization: UPdigital
  title: Cybersecurity Intern
  start: "2026-03"
  end: "2026-06"
  summary: Built the security layer of a GitHub Actions CI/CD pipeline at the University of Porto.
  details: |
    Built the security layer of a GitHub Actions–based CI/CD workflow, so that
    code shipped by development teams meets security requirements before it
    reaches production.

    - Designed secure CI/CD workflows covering the full cycle, from commit to deploy.
    - Integrated SAST (Bandit, SonarQube, CodeQL, Snyk) and SCA for Python and
      PL/SQL code and its dependencies, and explored DAST and container/IaC scanning.
    - Defined quality gates that block vulnerable code, with remediation guides
      for developers.
    - Set up DefectDojo as the central platform for findings from every scanner.
    - Designed a Git branching strategy adopted as the standard across
      development teams.
  links:
    - name: UPdigital
      url: https://www.up.pt/portal/pt/updigital

