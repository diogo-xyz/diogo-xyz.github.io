bio: |
  I'm an AI & Data Science graduate from the University of Porto, currently
  pursuing a Master's in Information Security at FCUP. My focus lies in
  cybersecurity and artificial intelligence, both as standalone fields and in
  the space where they meet: building AI that is secure by design, and using
  AI to make systems more resilient.

  As a member of xSTF, the University of Porto's cybersecurity team, I also
  compete in CTFs, where I put theory into practice. This site is where I
  document what I learn along the way.

  I was twice awarded the Impulso Jovens STEAM Merit Scholarship. Beyond
  academics, six years as a federated competitive swimmer and four years of
  karate shaped a lot of how I approach work today: discipline, consistency,
  and the belief that real progress comes from showing up every day.
